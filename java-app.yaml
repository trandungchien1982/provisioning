apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-app
  template:
    metadata:
      labels:
        app: log-app
    spec:
      containers:
        - name: log-app
          image: openjdk:17
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 100); do
                echo "Log dòng số $i từ Java app";
                sleep 1;
              done;
              sleep 3600;