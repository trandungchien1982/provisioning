---
- name: Provision Docker + Docker Compose plugin + RabbitMQ
  hosts: rabbitmq_server
  become: true

  vars_files:
    - setup-ips.yml

  vars:
    app_dir: /opt/rabbitmq

  tasks:
#    - debug:
#      msg: "Target SSH host: {{ rabbitmq_ip }}"
#    - set_fact:
#      ansible_host: "{{ rabbitmq_ip }}"

    - name: Remove conflicting Docker packages
      tags: docker_install
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - podman-docker
          - containerd
          - runc
          - docker-compose
          - docker-compose-v2
        state: absent
        purge: true
      ignore_errors: true

    - name: Install prerequisite packages
      tags: docker_install
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create Docker keyrings directory
      tags: docker_install
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key with curl
      tags: docker_install
      ansible.builtin.command:
        cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        creates: /etc/apt/keyrings/docker.asc

    - name: Set permissions on Docker GPG key
      tags: docker_install
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        mode: "0644"
        state: file

    - name: Add Docker apt repository
      tags: docker_install
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine and Compose plugin
      tags: docker_install
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      tags: docker_install
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create application directory
      tags: rabbitmq
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy .env file
      tags: rabbitmq
      ansible.builtin.copy:
        src: files/.env
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Copy docker-compose.yaml
      tags: rabbitmq
      ansible.builtin.copy:
        src: files/docker-compose.yaml
        dest: "{{ app_dir }}/docker-compose.yaml"
        mode: "0644"

    - name: Create Docker network common-network
      tags: docker_install_network
      ansible.builtin.command:
        cmd: docker network create common-network
      ignore_errors: yes

    - name: Start RabbitMQ with Docker Compose v2
      tags: rabbitmq
      ansible.builtin.command:
        cmd: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Show running containers
      tags: rabbitmq
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Print running containers
      tags: rabbitmq
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
