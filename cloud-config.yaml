#cloud-config

hostname: ubuntu-2404-dev

users:
  - name: root
    lock_passwd: false
    plain_text_passwd: root
    ssh_authorized_keys:
  - ssh-rsa  laptop-asus-Windows10

  - ssh-rsa  laptop-asus-Windows10

  - ssh-rsa  laptop-asus-Windows10

  

ssh_pwauth: true
disable_root: false

package_update: true
packages:
  - docker.io
  - git
  - maven
  - gradle
  - ansible
  - openjdk-21-jdk

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - bash /root/script.sh