apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit

      # Put into /etc/hosts of fluent container to understand the domain host: vm-els-kibana = 10.169.10.69
      hostAliases:
        - ip: "10.169.10.69"
          hostnames:
            - "vm-els-kibana"

      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:2.2

          ports:
            - containerPort: 2020

          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: docker
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc
            - name: buffer
              mountPath: /buffers

      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: docker
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config
        - name: buffer
          emptyDir: {}