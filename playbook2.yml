---
- name: Provision Docker + Docker Compose plugin + MySQL
  hosts: target_server
  become: true

  vars_files:
    - setup-ips.yml

  vars:
    app_dir: /opt/mysql2

  tasks:
    - name: Show the target host IP for MySQL (Server 2)
      debug:
        msg: "Target IP is {{ mysql_ip }}"

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy docker-compose2.yaml
      ansible.builtin.copy:
        src: files/docker-compose2.yaml
        dest: "{{ app_dir }}/docker-compose.yaml"
        mode: "0644"

    - name: Start RabbitMQ with Docker Compose v2
      ansible.builtin.command:
        cmd: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Print running containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
