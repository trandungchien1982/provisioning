---
- name: Provision Docker + Docker Compose plugin + RabbitMQ
  hosts: rabbitmq_server
  become: true

  vars_files:
    - setup-ips.yml

  vars:
    app_dir: /opt/rabbitmq2

  tasks:
    - name: Create application directory
      tags: rabbitmq
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy .env file
      tags: rabbitmq
      ansible.builtin.copy:
        src: files/.env
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Copy docker-compose2.yaml
      tags: rabbitmq
      ansible.builtin.copy:
        src: files/docker-compose2.yaml
        dest: "{{ app_dir }}/docker-compose.yaml"
        mode: "0644"

    - name: Start RabbitMQ with Docker Compose v2
      tags: rabbitmq
      ansible.builtin.command:
        cmd: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Show running containers
      tags: rabbitmq
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Print running containers
      tags: rabbitmq
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
