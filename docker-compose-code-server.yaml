services:
  code-server:
    image: yeasy/simple-web:latest
    container_name: code-server
    restart: always
    ports:
      - "9001:80"
    networks:
      - common-network

  code-server2:
    image: yeasy/simple-web:latest
    container_name: code-server2
    restart: always
    ports:
      - "9002:80"
    networks:
      - common-network

  code-server3:
    image: nginxdemos/hello:0.4
    container_name: code-server3
    restart: always
    ports:
      - "9003:80"
    networks:
      - common-network

networks:
  common-network:
    external: true