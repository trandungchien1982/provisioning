apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        storage.path  /buffers

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        Parser            cri
        DB                /buffers/flb.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [FILTER]
        Name record_modifier
        Match *
        Record cluster k3d-cluster
        Record job fluent-bit

    [OUTPUT]
        Name              es
        Match             *
        Host              vm-els-kibana
        Port              9200
        HTTP_User         elastic
        HTTP_Passwd       elastic
        Index             k8s-logs
        Logstash_Format   On
        Logstash_Prefix   k8s
        Replace_Dots      On
        Retry_Limit       False
        tls               Off
        Suppress_Type_Name On
        Type               doc
        Generate_ID       On

  parsers.conf: |
    [PARSER]
        Name   cri
        Format regex
        Regex  ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z