version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.3.0
    container_name: elasticsearch-8
    environment:
      - ELASTIC_PASSWORD=elastic

      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.3.0
    container_name: kibana-8
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

      - xpack.encryptedSavedObjects.encryptionKey=0123456789abcdef0123456789abcdef
      - xpack.security.encryptionKey=abcdef0123456789abcdef0123456789
      - xpack.reporting.encryptionKey=1234567890abcdef1234567890abcdef

      - xpack.monitoring.ui.container.elasticsearch.enabled=true

    ports:
      - "5601:5601"

volumes:
  es_data:
