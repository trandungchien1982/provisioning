version: "3.8"

services:
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    ports:
      - "80:80"

    # The default user is: admin, the password can be extracted in docker logs ...
    volumes:
      - /root/test-123:/srv
      - ./data:/database
      - ./config:/config

    environment:
      - PUID=0
      - PGID=0

    # CLI for create new user, but not working properly
    command: >
      sh -c "
        filebrowser config init &&
        filebrowser users add admin1 password12345678 --perm.admin || true &&
        filebrowser -r /srv
      "

    restart: always