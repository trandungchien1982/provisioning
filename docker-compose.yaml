version: "3.8"

services:
  sftp:
    image: atmoz/sftp:debian
    container_name: sftp-server
    restart: always
    volumes:
      # List of user configuration
      #- ./users.conf:/etc/sftp/users.conf:ro
      # The folder name /home/admin/upload belongs to the user/pass : admin/admin
      - ./host_sftp/upload:/home/foo/upload
    ports:
      - "2222:22"
    command: foo:foo:1001
