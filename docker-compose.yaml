version: '3.9'

services:
  coredns:
    image: coredns/coredns:1.14.2
    container_name: coredns
    restart: always

    ports:
      - "53:53/udp"
      - "53:53/tcp"

    volumes:
      - ./Corefile:/Corefile
      - ./zones:/zones

    command: -conf /Corefile

  coredns-new:
    image: coredns/coredns:1.14.2
    container_name: coredns-new
    restart: always

    ports:
      - "153:53/udp"
      - "153:53/tcp"

    volumes:
      - ./Corefile-1:/Corefile
      - ./zones-1:/zones-1

    command: -conf /Corefile
