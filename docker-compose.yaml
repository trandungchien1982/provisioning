services:
  nginx:
    image: nginx:1.27-alpine
    container_name: wordpress-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/https-conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - common-network
    depends_on:
      - wordpress-server-db
      - wordpress-site1
      - wordpress-site2

  wordpress-server-db:
    image: mariadb:11.4
    container_name: wp-mariadb
    ports:
      - "3306:3306"

    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp_main
      MARIADB_USER: wp_user
      MARIADB_PASSWORD: wp_password_change_me
    volumes:
      - ./mariadb-data:/var/lib/mysql
    networks:
      - common-network

  wordpress-site1:
    image: wordpress:6.6.2-php8.3-apache
    container_name: wordpress-site1
    restart: always
    environment:
      WORDPRESS_DB_HOST: wordpress-server-db:3306
      WORDPRESS_DB_NAME: wp_site1
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./wordpress-site1-data:/var/www/html
    networks:
      - common-network
    depends_on:
      - wordpress-server-db

  wordpress-site2:
    image: wordpress:6.6.2-php8.3-apache
    container_name: wordpress-site2
    restart: always
    environment:
      WORDPRESS_DB_HOST: wordpress-server-db:3306
      WORDPRESS_DB_NAME: wp_site2
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./wordpress-site2-data:/var/www/html
    networks:
      - common-network
    depends_on:
      - wordpress-site1

networks:
  common-network:
    external: true