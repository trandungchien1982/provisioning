services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: always

    ports:
      - "8443:8443"

    # Hieu chinh bien moi truong
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      # Mat khau mac dinh
      # PASSWORD SUDO ...
      - PASSWORD=admin
      - SUDO_PASSWORD=admin
      - DEFAULT_WORKSPACE=/workspace

    volumes:
      - ./config:/config
      - ./workspace:/workspace