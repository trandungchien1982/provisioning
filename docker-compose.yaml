services:
  mailpit:
    image: axllent/mailpit:v1.29.7
    restart: always
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      # Limit 30K mails
      MP_MAX_MESSAGES: 30000
      MP_DATABASE: /data/mailpit.db
      # No authentication
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Ignore delays in receiving mails
      MP_SMTP_DISABLE_RDNS: "true"
      MP_COMPRESSION: 1