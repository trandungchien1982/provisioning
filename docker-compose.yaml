version: '3.9'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis

    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --protected-mode no

    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: always
    mem_limit: 4g

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI for Redis browsing
  redisinsight:
    image: redis/redisinsight:3.4.2
    container_name: redisinsight
    ports:
      - "5540:5540"
    restart: always