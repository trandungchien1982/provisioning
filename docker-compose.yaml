version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.3.0
    container_name: es8
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=elastic
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  bootstrap:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.3.0
    container_name: es_bootstrap
    user: "0:0"
    depends_on:
      - elasticsearch
    volumes:
      - ./bootstrap.sh:/bootstrap.sh
      - token_data:/token:rw
    entrypoint: ["bash", "/bootstrap.sh"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.3.0
    container_name: kibana8
    depends_on:
      - elasticsearch
      - bootstrap
    ports:
      - "5601:5601"
    volumes:
      - ./kibana-entrypoint.sh:/kibana-entrypoint.sh
      - token_data:/token
    entrypoint: ["bash", "/kibana-entrypoint.sh"]

volumes:
  es_data:
  token_data: