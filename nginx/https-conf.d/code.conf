# Common proxy headers (for https)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# We need to resolve in port 443
server {
    listen 443 ssl;
    server_name code.tdc.vv;

    ssl_certificate     /etc/nginx/certs/fullchain_wildcard.tdc.vv.pem;
    ssl_certificate_key /etc/nginx/certs/privkey_wildcard.tdc.vv.pem;

    location / {
        proxy_pass http://code-server:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

